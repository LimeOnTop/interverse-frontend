<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тренировки — Design review · InterVerse</title>
<style>
:root{--bg:#f5f2ea;--paper:#fffdf8;--ink:#26332b;--muted:#637066;--line:#dddeda;--accent:#315d46;--tint:#e8eee3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}body.dark{--bg:#14161b;--paper:#1d2027;--ink:#eeeef2;--muted:#a6aab5;--line:#343843;--accent:#c084fc;--tint:#30263f}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 16px;min-height:44px}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button[aria-pressed=true],.chosen{background:var(--tint);border-color:var(--accent);color:var(--accent)}button:disabled{opacity:.4;cursor:default}.primary{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:650}.dark .primary{color:#160d23}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:var(--paper)}.brand{font-weight:800;font-size:22px;letter-spacing:-1px}.brand small{font-size:10px;letter-spacing:2px;color:var(--muted);display:block}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.avatar{width:30px;height:30px;border-radius:7px;background:var(--tint);display:grid;place-items:center;font-size:12px;font-weight:700}.profile{display:flex;gap:9px;align-items:center;border-radius:14px;background:var(--bg);padding:6px 12px}.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 76px)}.sidebar{padding:28px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:7px}.sidebar button{text-align:left;border-color:transparent;background:transparent}.sidebar .active{background:var(--tint);color:var(--accent)}.sidebar .profile{margin-top:auto;border:1px solid var(--line);font-size:12px}.muted,small{color:var(--muted)}main{padding:26px 40px 60px;max-width:1320px;width:100%;margin:auto}.review{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:30px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.7px;color:var(--muted);font-weight:650}h1{font-size:36px;line-height:1.15;letter-spacing:-1.2px;margin:10px 0}h2{font-size:23px;line-height:1.35;letter-spacing:-.5px;margin:0 0 10px}h3{font-size:15px;margin:0 0 12px}p{margin:8px 0 20px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;margin-top:28px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px}.summary{position:sticky;top:24px}.section{padding:22px 0;border-bottom:1px solid var(--line)}.section:first-child{padding-top:0}.section:last-child{border:0;padding-bottom:0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{text-align:left;padding:16px}.choice strong,.choice small{display:block}.choice small{font-size:12px;margin-top:5px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{padding:8px 13px}.label{display:block;font-weight:600;margin-bottom:9px}input,select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px;width:100%;min-height:44px}.search{margin-bottom:12px}.detail{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.detail strong{text-align:right}.note{font-size:12px;line-height:1.7;color:var(--muted)}.wide{width:100%;margin-top:20px}.steps{display:flex;gap:8px;margin-top:20px}.steps span{height:4px;flex:1;background:var(--line);border-radius:4px}.steps span:first-child{background:var(--accent)}.sessionhead{display:flex;justify-content:space-between;gap:15px;align-items:center}.sessionhead h1{font-size:29px}.progress{height:6px;background:var(--line);border-radius:8px;margin-top:12px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent)}.answer{width:100%;display:flex;align-items:center;gap:14px;text-align:left;margin:10px 0;padding:17px}.letter{width:32px;height:32px;border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;flex-shrink:0;font:12px monospace}.answer[aria-pressed=true] .letter{background:var(--accent);color:var(--paper)}.actions{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:22px;margin-top:28px}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.map button{padding:0;font:12px monospace}.map .done{background:var(--tint);color:var(--accent)}.map .current{outline:2px solid var(--accent);outline-offset:2px}.badge{border:1px solid var(--line);padding:4px 9px;border-radius:6px;font-size:12px}.editor{width:100%;min-height:270px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:18px;font:14px/1.8 monospace;margin-top:10px}.status{font-size:12px;color:var(--accent)}dialog{max-width:480px;width:calc(100% - 30px);border:1px solid var(--line);border-radius:18px;background:var(--paper);color:var(--ink);padding:28px}dialog::backdrop{background:#12191288}.empty{text-align:center;padding:40px 10px}.hidden{display:none!important}.review button{font-size:12px}.footerhint{margin-top:22px;font-size:12px;color:var(--muted)}@media(max-width:1100px){.shell{grid-template-columns:1fr}.sidebar{display:none}main{padding:24px}.layout{grid-template-columns:minmax(0,1fr) 260px}}@media(max-width:740px){.top{padding:0 18px;height:66px}.profile .username{display:none}main{padding:20px 16px 110px}.review{align-items:flex-start;flex-direction:column;margin-bottom:22px}.layout{grid-template-columns:1fr;gap:16px}.summary{position:static}.panel{padding:20px;border-radius:14px}h1{font-size:29px}.choices{grid-template-columns:1fr 1fr}.choice{padding:12px}.actions{position:sticky;bottom:10px;background:var(--paper);padding:12px;border:1px solid var(--line);border-radius:12px;box-shadow:0 5px 25px #0001}.actions .row{flex-wrap:nowrap;gap:6px}.actions button{font-size:13px;padding:10px;white-space:nowrap}.sessionhead{align-items:flex-start}.sessionhead h1{font-size:23px}.session-layout .summary{grid-row:1}.session-layout .summary .note{display:none}.map{grid-template-columns:repeat(5,1fr)}.map button{min-height:44px}.session-layout .summary h3{margin-bottom:10px}.answer{padding:14px;align-items:flex-start}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}}
</style>
<header class="top"><div class="brand">interverse<small>ПРАКТИКА ДАЁТ УВЕРЕННОСТЬ</small></div><div class="row"><button id="theme" aria-label="Переключить тему">◐</button><button class="profile"><span class="avatar">АК</span><span class="username">Алексей</span></button></div></header>
<div class="shell"><aside class="sidebar"><span class="eyebrow" style="padding:0 16px 12px">Рабочее пространство</span><button>◫　Обзор</button><button class="active" onclick="show('setup')">↗　Тренировки</button><button>▤　Отчёты</button><button>◎　Направления</button><div class="profile"><span class="avatar">АК</span><div><strong>Алексей</strong><br><small>alex@example.com</small></div></div></aside><main><div class="review"><span class="eyebrow">Design review · интерактивный макет</span><div class="row"><button onclick="show('setup')">Создание</button><button onclick="show('session')">Прохождение</button><button onclick="current=8;show('session')">Практическая задача</button></div></div><div id="screen"></div></main></div>
<dialog id="finish"><span class="eyebrow">Перед завершением</span><h2 style="margin-top:12px">Проверим ответы?</h2><p id="finish-copy" class="muted"></p><div class="row"><button onclick="document.querySelector('#finish').close();jumpMissing()">Вернуться к вопросам</button><button class="primary" onclick="document.querySelector('#finish').close();show('complete')">Завершить</button></div></dialog>
<script>
const $=s=>document.querySelector(s);let view='setup',current=0;const stacks={Backend:['Python','Go','Java','Node.js','Django','PostgreSQL'],Frontend:['React','TypeScript','JavaScript','Vue.js','CSS3','Next.js'],DevOps:['Docker','Kubernetes','Terraform','AWS','Prometheus'],QA:['Playwright','Cypress','Selenium','Postman','Jest'],'Data Science':['Python','SQL','Pandas','NumPy','PyTorch']};let config={spec:'Frontend',tech:['React','TypeScript'],level:'Middle',tasks:'few',mode:'now',date:''};let answers={};try{const saved=JSON.parse(localStorage.getItem('iv-design-training'));if(saved){config=saved.config;answers=saved.answers||{}}}catch{}function save(){localStorage.setItem('iv-design-training',JSON.stringify({config,answers}))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function choose(k,v){config[k]=v;if(k==='spec')config.tech=[];save();render()}function toggleTech(t){config.tech=config.tech.includes(t)?config.tech.filter(x=>x!==t):[...config.tech,t];save();render()}function show(v){view=v;render()}function option(k,v,label,copy=''){return `<button class="choice" aria-pressed="${config[k]===v}" onclick="choose('${k}','${v}')"><strong>${label}${config[k]===v?'　✓':''}</strong><small>${copy}</small></button>`}function summary(){return `<aside class="panel summary"><span class="eyebrow">Ваша тренировка</span><h2 style="margin-top:10px">${esc(config.spec)} · ${config.level}</h2><div class="detail"><span class="muted">Технологии</span><strong>${config.tech.map(esc).join(', ')||'Выберите стек'}</strong></div><div class="detail"><span class="muted">Практика</span><strong>${config.tasks==='theory'?'Только теория':config.tasks==='few'?'1–3 задачи':'4–6 задач'}</strong></div><p class="note" style="margin-top:18px">Вопросы подберём по стеку и уровню. Число задач зависит от доступных заданий в банке.</p><button class="primary wide" ${!config.tech.length||(config.mode==='later'&&(!config.date||new Date(config.date)<=new Date()))?'disabled':''} onclick="start()">${config.mode==='later'?'Запланировать тренировку':'Начать тренировку　↗'}</button><p class="note">${config.mode==='later'?'Дата и время указаны в вашем часовом поясе.':'Можно вернуться к любому вопросу до завершения.'}</p><span class="status">✓ Настройки сохранены в этом браузере</span></aside>`}function setup(){return `<span class="eyebrow">Новая тренировка</span><h1>Практика под вашу цель.</h1><p class="muted">Выберите стек и сложность. Все настройки — перед вами.</p><div class="layout"><section class="panel"><div class="section"><h3>01 / Направление</h3><div class="choices">${Object.keys(stacks).map(s=>option('spec',s,s,{Backend:'Сервисы и данные',Frontend:'Интерфейсы и браузер',DevOps:'Инфраструктура',QA:'Качество продукта','Data Science':'Данные и модели'}[s])).join('')}</div></div><div class="section"><h3>02 / Технологии <small> · можно выбрать несколько</small></h3><input class="search" aria-label="Поиск технологий" placeholder="Найти технологию в направлении" oninput="filterTech(this.value)"><div class="chips" id="tech">${techButtons(stacks[config.spec])}</div><p class="note" style="margin-bottom:0">${config.tech.length?'Выбрано: '+config.tech.map(esc).join(' · '):'Выберите хотя бы одну технологию.'}</p></div><div class="section"><h3>03 / Уровень</h3><div class="chips">${['Intern','Junior','Middle','Senior','Lead'].map(s=>option('level',s,s)).join('')}</div></div><div class="section"><h3>04 / Практические задачи</h3><div class="choices">${option('tasks','theory','Только теория','Без задач')}${option('tasks','few','Немного практики','1–3 задачи')}${option('tasks','many','Больше практики','4–6 задач')}</div></div><div class="section"><h3>05 / Когда начнём?</h3><div class="chips">${option('mode','now','Сейчас')}${option('mode','later','Запланировать')}</div>${config.mode==='later'?`<label class="label" style="margin-top:16px">Дата и время<input type="datetime-local" value="${esc(config.date)}" onchange="config.date=this.value;save();render()"></label>`:''}</div></section>${summary()}</div>`}function techButtons(list){return list.map(t=>`<button aria-pressed="${config.tech.includes(t)}" onclick="toggleTech('${t}')">${t} ${config.tech.includes(t)?'✓':'+'}</button>`).join('')}function filterTech(s){$('#tech').innerHTML=techButtons(stacks[config.spec].filter(t=>t.toLowerCase().includes(s.toLowerCase())))||'<p class="note">Нет совпадений. Попробуйте другой запрос.</p>'}function start(){if(config.mode==='later'){view='scheduled';render()}else{current=0;show('session')}}
const questions=[['Зачем React использует ключи (key) при рендеринге списка?',['Чтобы сопоставлять элементы между рендерами','Чтобы автоматически сортировать список','Чтобы передавать ключ в props компонента','Чтобы отключать повторный рендер']],['Когда стоит использовать useMemo?',['Для любого вычисления в компоненте','Для дорогого вычисления с известными зависимостями','Вместо useEffect','Для хранения изменяемого значения']],['Что даёт объединение типов в TypeScript?',['Значение может принадлежать одному из перечисленных типов','Все поля становятся обязательными','Отключается проверка типов','Создаётся новый класс']],['Что происходит при обновлении состояния React?',['React планирует новый рендер','Вся страница перезагружается','Компонент удаляется','Меняются все значения props']],['Как работает замыкание в JavaScript?',['Функция сохраняет доступ к лексическому окружению','Функция всегда выполняется один раз','Переменные становятся глобальными','Все значения копируются']],['Что означает readonly в TypeScript?',['Запрещает присваивание полю при проверке типов','Замораживает объект во время выполнения','Удаляет поле','Делает поле необязательным']],['Как корректно обновить массив в состоянии?',['Создать новый массив','Всегда изменять исходный массив','Изменить length напрямую','Использовать глобальную переменную']],['Для чего нужен cleanup в useEffect?',['Для освобождения ресурсов эффекта','Для обновления props','Для создания контекста','Для проверки типов']]];function answered(i){return i<8?answers[i]!==undefined:Boolean(answers[i]?.trim())}function selectAnswer(i){answers[current]=i;save();render()}function move(i){current=Math.max(0,Math.min(9,i));render()}function jumpMissing(){move(Array.from({length:10},(_,i)=>i).find(i=>!answered(i))??0)}function finish(){const missing=10-Object.keys(answers).filter(i=>answered(+i)).length;$('#finish-copy').textContent=missing?`Осталось без ответа: ${missing}. Можно вернуться к ним или завершить тренировку с пропусками.`:'Вы ответили на все вопросы и задачи. После завершения ответы отправятся на проверку.';$('#finish').showModal()}function session(){let filled=Array.from({length:10},(_,i)=>i).filter(answered).length;let task=current>=8;return `<div class="sessionhead"><div><span class="eyebrow">Тренировка · режим фокуса</span><h1>${esc(config.tech.join(' · ')||config.spec)} <span class="muted">/ ${config.level}</span></h1></div><button onclick="show('setup')">Выйти</button></div><div class="row" style="justify-content:space-between"><span class="muted">${filled} из 10 ответов</span><span class="status">✓ Ответы сохранены в браузере</span></div><div class="progress"><span style="width:${filled*10}%"></span></div><div class="layout session-layout"><section class="panel"><div class="row" style="justify-content:space-between"><span class="eyebrow">${task?'Задача '+(current-7)+' / 2':'Вопрос '+String(current+1).padStart(2,'0')+' / 08'}</span><span class="badge">${task?'Практика':'Теория'}</span></div><h2 style="margin-top:24px">${task?(current===8?'Реализуйте функцию debounce.':'Уберите дубликаты из массива объектов по id.'):questions[current][0]}</h2><p class="muted">${task?'Опишите подход словами или напишите код. Учтите граничные случаи.':'Выберите один вариант ответа. Его можно изменить до завершения.'}</p>${task?`<label class="label" for="solution">Ваше решение</label><textarea id="solution" class="editor" spellcheck="false" placeholder="// Начните с вашего подхода…" oninput="answers[current]=this.value;save();document.querySelector('#saved').textContent='✓ Черновик сохранён'">${esc(answers[current]||'')}</textarea><span id="saved" class="status">✓ Черновик сохранён</span>`:questions[current][1].map((a,i)=>`<button class="answer" aria-pressed="${answers[current]===i}" onclick="selectAnswer(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${a}</span></button>`).join('')}<footer class="actions"><button ${current===0?'disabled':''} onclick="move(current-1)">← Назад</button><div class="row">${current<9?'<button onclick="move(current+1)">Пропустить</button>':''}<button class="primary" onclick="${current===9?'finish()':'move(current+1)'}">${current===9?'Завершить': 'Далее →'}</button></div></footer></section><aside class="panel summary"><h3>Карта тренировки</h3><div class="map">${Array.from({length:10},(_,i)=>`<button aria-label="${i<8?'Вопрос '+(i+1):'Задача '+(i-7)}${answered(i)?', ответ сохранён':''}" ${i===current?'aria-current="step"':''} class="${answered(i)?'done ':''}${i===current?'current':''}" onclick="move(${i})">${i<8?String(i+1).padStart(2,'0'):'{'+(i-7)+'}'}</button>`).join('')}</div><p class="note" style="margin-top:18px">Заливка — ответ сохранён.<br>Обводка — текущий шаг.<br>Без заливки — ещё нет ответа.</p><div class="detail"><span>Теория</span><strong>8 вопросов</strong></div><div class="detail"><span>Практика</span><strong>2 задачи</strong></div><p class="note">Можно проходить в любом порядке. Пропущенные шаги проверим перед завершением.</p><button class="wide" onclick="finish()">Завершить тренировку</button></aside></div><p class="footerhint">Демонстрационная сессия: 8 вопросов и 2 задачи. Состав здесь фиксирован для просмотра дизайна; ответы не отправляются на сервер.</p>`}function render(){$('#screen').innerHTML=view==='setup'?setup():view==='session'?session():view==='scheduled'?`<section class="panel empty"><span class="eyebrow">План готов</span><h1>Время для практики выделено.</h1><p class="muted">${esc(config.spec)} · ${config.level}<br>${esc(config.date.replace('T',' · '))}</p><p class="note">Это демонстрация. Тренировка не создана на сервере.</p><button class="primary" onclick="show('setup')">Вернуться к настройкам</button></section>`:`<section class="panel empty"><span class="eyebrow">Практика завершена</span><h1>Теперь — разбор.</h1><p class="muted">Ответов сохранено: ${Array.from({length:10},(_,i)=>i).filter(answered).length} из 10.</p><p class="note">В продукте здесь появится статус проверки и ссылка на отчёт.<br>В макете ответы остаются в браузере.</p><button class="primary" onclick="show('session')">Посмотреть ответы</button> <button onclick="show('setup')">Новая тренировка</button></section>`}$('#theme').onclick=()=>document.body.classList.toggle('dark');render();
</script></html>
